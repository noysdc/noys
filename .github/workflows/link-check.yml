name: Link check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [master]
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install Pages-compatible Jekyll
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
        run: |
          printf 'source "https://rubygems.org"\ngem "github-pages", group: :jekyll_plugins\ngem "webrick"\n' > Gemfile.ci
          bundle install --jobs 4
      - name: Build site
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
        run: bundle exec jekyll build
      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --max-retries 2
            --accept 200,206,403,429
            --exclude 'cdn-cgi' --exclude 'instagram.com' --exclude 't.me'
            --root-dir "${{ github.workspace }}/_site"
            './_site/**/*.html'
          fail: true