<script>
/* جلوگیری از پرش تم و اندازه فونت قبل از لود شدن صفحه */
(function(){try{var r=document.documentElement,t=localStorage.getItem('noys-theme')||'dark',f=localStorage.getItem('noys-fs');r.setAttribute('data-theme',t);if(f)r.style.fontSize=f+'%';if(localStorage.getItem('noys-reading')==='1')r.classList.add('nh-reading')}catch(e){}})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/noys-header.css' | relative_url }}">

<header class="nh" id="nh" data-index="{{ '/search-index.json' | relative_url }}">

  <a class="nh-logo" href="{{ '/' | relative_url }}" aria-label="NOYS">
    <img src="{{ '/assets/img/template/noys-avatar.png' | relative_url }}" alt="NOYS" width="112" height="112">
  </a>

  <a class="nh-name" href="{{ '/' | relative_url }}">یونس شجاعی</a>
  <p class="nh-tag">روایت‌هایی درباره پرونده‌های واقعی، کسب‌وکارهای سایه و بازارهای سیاه</p>

  <div class="nh-divider" aria-hidden="true"></div>

  <!-- باکس منو -->
  <div class="nh-box nh-menu">
    <div class="nh-row">
      <div class="nh-search">
        <svg class="nh-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="nh-q" type="search" placeholder="جستجوی مطلب" autocomplete="off" aria-label="جستجوی مطلب" aria-controls="nh-results">
        <ul id="nh-results" class="nh-results" role="listbox" hidden></ul>
      </div>
      <div class="nh-tools">
        <button class="nh-btn" id="nh-theme" type="button" aria-label="تغییر تم">
          <svg class="nh-ico nh-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="nh-ico nh-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
        </button>
        <button class="nh-btn" id="nh-fs-down" type="button" aria-label="کوچک‌تر کردن متن">A-</button>
        <button class="nh-btn" id="nh-fs-up" type="button" aria-label="بزرگ‌تر کردن متن">A+</button>
        <button class="nh-btn" id="nh-reading" type="button" aria-label="حالت مطالعه" aria-pressed="false">
          <svg class="nh-ico" viewBox="0 0 24 24"><path d="M3 5h6a3 3 0 013 3v12a2 2 0 00-2-2H3zM21 5h-6a3 3 0 00-3 3v12a2 2 0 012-2h7z"/></svg>
        </button>
      </div>
    </div>
    <nav class="nh-nav" aria-label="منوی اصلی">
      <a href="{{ '/' | relative_url }}" data-path="/">مجله</a>
      <a href="{{ '/podcast/' | relative_url }}" data-path="/podcast/">پادکست</a>
    </nav>
  </div>

  <!-- باکس طبقه‌بندی‌ها -->
  <div class="nh-box nh-cats" aria-label="موضوعات">
    <button class="nh-arrow" id="nh-right" type="button" aria-label="قبلی">
      <svg class="nh-ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="nh-scroll" id="nh-scroll">
      {% assign nh_cats = site.categories | sort %}
      {% for category in nh_cats %}
        <a class="nh-chip" href="{{ '/categories/' | relative_url }}#{{ category[0] | url_encode }}">
          <span>{{ category[0] }}</span><b>{{ category[1].size }}</b>
        </a>
      {% endfor %}
    </div>
    <button class="nh-arrow" id="nh-left" type="button" aria-label="بعدی">
      <svg class="nh-ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <div class="nh-divider" aria-hidden="true"></div>
</header>

<script src="{{ '/assets/js/noys-header.js' | relative_url }}" defer></script>
