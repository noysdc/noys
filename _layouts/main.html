---
layout: default
---

<div class="content-box clearfix">

  {% if page.url == "/" %}
  {% include home-hero.html %}
  {% endif %}

  {{ content }}

</div>


{% if page.url == "/" %}
{% include world-map.html %}
{% endif %}


<style>

/* =========================================================
   NOYS - MAIN LAYOUT
   ========================================================= */

.content-box {
  width: 100%;
}


/* =========================================================
   POST ROW (پست‌هایی که عکس کاور دارن - عکس سمت راست، متن سمت چپ)
   ========================================================= */

.post:not(.post-text-only) {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 22px;
}


/* =========================================================
   POST THUMBNAIL
   نسبت ۱۶:۹ دقیقاً هم‌اندازه‌ی کاورهای ۱۹۲۰x۱۰۸۰ مجله هست،
   پس با background-size: cover چیزی از عکس بریده نمی‌شه
   ========================================================= */

.post-thumbnail {
  display: block;

  flex: 0 0 300px;
  width: 300px;
  aspect-ratio: 16 / 9;
  height: auto;

  background-position: center center;
  background-repeat: no-repeat;
  background-size: cover;

  border-radius: 8px;

  margin-bottom: 0;

  box-shadow: 0 0 0 rgba(31, 35, 46, 0);

  transition:
    transform 0.3s ease,
    box-shadow 0.3s ease,
    opacity 0.25s ease;
}


/* Hover */

.post-thumbnail:hover {
  opacity: 0.96;

  transform: translateY(-4px);
}


/* =========================================================
   POST CONTENT
   ========================================================= */

.post:not(.post-text-only) .post-content {
  flex: 1 1 auto;
  min-width: 0;
  width: auto;
}

.post-content {
  width: 100%;
  padding: 0;
}


/* =========================================================
   POST TITLE
   ========================================================= */

.post-title {
  margin: 0 0 10px 0;

  font-size: 25px;
  line-height: 1.6;

  font-weight: 700;

  text-align: right;
}

.post-title a {
  color: #222;
  text-decoration: none;
}

.post-title a:hover {
  color: #263959;
}


/* =========================================================
   POST DESCRIPTION
   ========================================================= */

.post-content p {
  margin: 0 0 13px 0;

  font-size: 16px;
  line-height: 1.9;

  color: #555;

  text-align: right;
}


/* =========================================================
   POST META
   ========================================================= */

.post-date,
.post-words {

  display: inline-block;

  font-size: 13px;
  line-height: 1.8;

  color: #888;
}


/* =========================================================
   COPYRIGHT / FOOTER LINKS
   ========================================================= */

.copyright-links {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

.copyright-links a {
  color: #999;
  text-decoration: underline;
}


/* =========================================================
   PAGINATION
   طراحی کامل دکمه‌های صفحه قبلی/بعدی توی assets/css/custom.css هست
   (کلاس‌های .noys-pagination*) — این‌جا فقط فاصله‌ی بالای بلاک.
   ========================================================= */

.noys-pagination {
  margin-top: 40px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

  .post {
    margin-bottom: 30px;
  }

  .post:not(.post-text-only) {
    flex-direction: column;
    gap: 15px;
  }

  .post-thumbnail {
    width: 100%;
    flex-basis: auto;
    aspect-ratio: 16 / 9;
    height: auto;

    margin-bottom: 0;
  }

  .post-title {
    font-size: 22px;
    line-height: 1.6;
  }

  .post-content p {
    font-size: 15px;
    line-height: 1.9;
  }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 480px) {

  .post-thumbnail {
    border-radius: 7px;
  }

  .post-title {
    font-size: 20px;
  }

  .post-content p {
    font-size: 15px;
  }

}

</style>
