name: Update podcast feed

on:
  schedule:
    - cron: "17 */6 * * *"   # هر ۶ ساعت
  workflow_dispatch:          # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feed
        run: python scripts/fetch_podcast_feed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/podcasts_feed.json
          git diff --cached --quiet || (git commit -m "Update podcast feed" && git push)
